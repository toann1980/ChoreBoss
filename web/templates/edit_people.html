{% extends "base.html" %}
{% block title %}
  Edit People
{% endblock title %}
{% block content %}
  <div class="container-lg">
    <h1 class="mt-5">Edit People</h1>
    <ul class="list-group">
      {% for person in people %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <a href="{{ url_for('person_detail', person_id=person.id) }}">
            {{ person.first_name }} {{ person.last_name }}
          </a>
          <a class="btn btn-sm btn-outline-primary"
             href="{{ url_for('person_chores', person_id=person.id) }}">View Chores</a>
        </li>
      {% endfor %}
    </ul>
    <div class="row mt-3">
      <div class="col-6">
        <button class="btn btn-primary"
                onclick="window.location.href='{{ url_for("change_sequence") }}'"
                {% if not people or people|length < 2 %}disabled{% endif %}>Change Sequence</button>
      </div>
    </div>
  </div>
{% endblock content %}
